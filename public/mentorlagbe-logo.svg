<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="660" height="200" role="img" aria-label="MentorLagbe logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="url(#bg)"/>
  <!-- M built from two open-book pages -->
  <path d="M56 142 V90 L100 124 L144 90 V142" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Graduation cap -->
  <path d="M80 62 V76 Q100 88 120 76 V62" fill="#D97706"/>
  <path d="M100 34 L142 54 L100 74 L58 54 Z" fill="url(#gold)"/>
  <path d="M132 58 V76" stroke="#FDE68A" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="132" cy="79" r="4.5" fill="#FDE68A"/>

  <!-- Wordmark -->
  <text x="206" y="108" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    <tspan fill="#1E1B4B">Mentor</tspan><tspan fill="#F59E0B">Lagbe</tspan>
  </text>
  <text x="208" y="144" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3.5" fill="#64748B">FIND YOUR PERFECT TUTOR</text>
</svg>
